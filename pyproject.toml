[project]
name = "blaster"
version = "1.0"
description = "Fast floating-point LLL-reduction"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = ["matplotlib", "numpy"]

[project.scripts]
blaster = "blaster.cli:__main__"

[dependency-groups]
build = ["nanobind", "scikit-build-core"]
dev = [
    { include-group = "build" },
    "fpylll; python_version < '3.15'",
    "pytest",
    "ruff",
    "scipy",
]

[build-system]
requires = ["scikit-build-core", "nanobind"]
build-backend = "scikit_build_core.build"

[tool.uv]
default-groups = ["build"]
no-build-isolation-package = ["blaster"]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "CMakeLists.txt" },
    { file = "core/**" },
]

[tool.scikit-build]
build-dir = "build"
wheel.packages = ["src/blaster"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
